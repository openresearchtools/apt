name: Publish APT repository metadata

on:
  workflow_dispatch:
  repository_dispatch:
    types: [package-released]
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: apt-repository-release
  cancel-in-progress: false

jobs:
  publish:
    name: Build, sign, and upload repository metadata
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: apt-signing
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            apt-utils ca-certificates curl dpkg-dev gnupg jq

      - name: Build and sign repository indexes
        env:
          GH_TOKEN: ${{ github.token }}
          APT_GPG_SIGNING_SUBKEY_B64: ${{ secrets.APT_GPG_SIGNING_SUBKEY_B64 }}
          APT_KEY_PASSWORD: ${{ secrets.APT_KEY_PASSWORD }}
        run: ./scripts/build-repository.sh

      - name: Create repository release when absent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view repo >/dev/null 2>&1; then
            gh release create repo \
              --title 'Open Research Tools APT repository' \
              --notes 'Machine-generated signed APT repository assets.' \
              --latest=false
          fi

      - name: Remove obsolete release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t expected_assets < <(
            find _repo -maxdepth 1 -type f -printf '%f\n' | sort
          )
          while IFS= read -r published_asset; do
            if ! printf '%s\n' "${expected_assets[@]}" \
              | grep --fixed-strings --line-regexp --quiet "$published_asset"; then
              gh release delete-asset repo "$published_asset" --yes
            fi
          done < <(
            gh release view repo --json assets --jq '.assets[].name'
          )

      - name: Upload keyring and public-key assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' assets < <(
            find _repo -maxdepth 1 -type f \
              ! -name 'Packages' \
              ! -name 'Packages.gz' \
              ! -name 'Release' \
              ! -name 'Release.gpg' \
              ! -name 'InRelease' \
              -print0
          )
          gh release upload repo "${assets[@]}" --clobber

      - name: Upload indexes and signatures last
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload repo \
            _repo/Packages \
            _repo/Packages.gz \
            _repo/Release \
            _repo/Release.gpg \
            _repo/InRelease \
            --clobber
