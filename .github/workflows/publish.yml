name: Publish APT repository

on:
  workflow_dispatch:
  repository_dispatch:
    types: [package-released]
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and sign repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: apt-signing
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            apt-utils ca-certificates curl dpkg-dev gnupg jq

      - name: Build and sign repository
        env:
          GH_TOKEN: ${{ github.token }}
          APT_GPG_SIGNING_SUBKEY_B64: ${{ secrets.APT_GPG_SIGNING_SUBKEY_B64 }}
          APT_KEY_PASSWORD: ${{ secrets.APT_KEY_PASSWORD }}
        run: ./scripts/build-repository.sh

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
