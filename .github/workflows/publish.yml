name: Publish APT repository metadata

on:
  workflow_dispatch:
  repository_dispatch:
    types: [package-released]
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: apt-repository-release
  cancel-in-progress: false

jobs:
  publish:
    name: Build, sign, and upload repository metadata
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: apt-signing
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            apt-utils ca-certificates curl dpkg-dev gnupg jq

      - name: Test carried-forward package indexing
        run: bash tests/test-carried-assets.sh

      - name: Build and sign repository indexes
        env:
          GH_TOKEN: ${{ github.token }}
          APT_GPG_SIGNING_SUBKEY_B64: ${{ secrets.APT_GPG_SIGNING_SUBKEY_B64 }}
          APT_KEY_PASSWORD: ${{ secrets.APT_KEY_PASSWORD }}
        run: |
          for channel in repo nightly; do
            APT_CHANNEL="$channel" ./scripts/build-repository.sh
          done

      - name: Publish stable and nightly catalogues
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish-repository.sh
