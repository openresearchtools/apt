name: Publish APT repository metadata

on:
  workflow_dispatch:
  repository_dispatch:
    types: [package-released]
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: apt-repository-release
  cancel-in-progress: false

jobs:
  publish:
    name: Build, sign, and upload repository metadata
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: apt-signing
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            apt-utils ca-certificates curl dpkg-dev gnupg jq

      - name: Build and sign repository indexes
        env:
          GH_TOKEN: ${{ github.token }}
          APT_GPG_SIGNING_SUBKEY_B64: ${{ secrets.APT_GPG_SIGNING_SUBKEY_B64 }}
          APT_KEY_PASSWORD: ${{ secrets.APT_KEY_PASSWORD }}
        run: ./scripts/build-repository.sh

      - name: Create repository release when absent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view repo >/dev/null 2>&1; then
            gh release create repo \
              --title 'Open Research Tools APT repository' \
              --notes 'Machine-generated signed APT repository assets.' \
              --latest=false
          fi

      - name: Remove obsolete release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          retry() {
            local attempt
            for attempt in 1 2 3 4 5 6; do
              if "$@"; then
                return 0
              fi
              if [[ "$attempt" -eq 6 ]]; then
                return 1
              fi
              sleep "$((attempt * 5))"
            done
          }
          mapfile -t expected_assets < <(
            find _repo -maxdepth 1 -type f -printf '%f\n' | sort
          )
          while IFS= read -r published_asset; do
            if ! printf '%s\n' "${expected_assets[@]}" \
              | grep --fixed-strings --line-regexp --quiet "$published_asset"; then
              retry gh release delete-asset repo "$published_asset" --yes
            fi
          done < <(
            gh release view repo --json assets --jq '.assets[].name'
          )

      - name: Upload keyring and public-key assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          retry() {
            local attempt
            for attempt in 1 2 3 4 5 6; do
              if "$@"; then
                return 0
              fi
              if [[ "$attempt" -eq 6 ]]; then
                return 1
              fi
              sleep "$((attempt * 5))"
            done
          }
          published_assets="$(
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/repo" --jq '.assets'
          )"
          mapfile -d '' assets < <(
            find _repo -maxdepth 1 -type f \
              ! -name 'Packages' \
              ! -name 'Packages.gz' \
              ! -name 'Release' \
              ! -name 'Release.gpg' \
              ! -name 'InRelease' \
              -print0
          )
          for asset in "${assets[@]}"; do
            asset_name="$(basename "$asset")"
            local_digest="sha256:$(sha256sum "$asset" | cut -d ' ' -f 1)"
            published_digest="$(
              jq -r --arg name "$asset_name" \
                '.[] | select(.name == $name) | .digest // empty' \
                <<<"$published_assets"
            )"
            if [[ "$local_digest" == "$published_digest" ]]; then
              printf 'Release asset is unchanged: %s\n' "$asset_name"
              continue
            fi
            retry gh release upload repo "$asset" --clobber
          done

      - name: Upload indexes and signatures last
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          retry() {
            local attempt
            for attempt in 1 2 3 4 5 6; do
              if "$@"; then
                return 0
              fi
              if [[ "$attempt" -eq 6 ]]; then
                return 1
              fi
              sleep "$((attempt * 5))"
            done
          }
          retry gh release upload repo \
            _repo/Packages \
            _repo/Packages.gz \
            _repo/Release \
            _repo/Release.gpg \
            _repo/InRelease \
            --clobber
