name: Bootstrap APT signing key

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    name: Generate encrypted key backup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: apt-signing

    steps:
      - name: Generate and encrypt the archive signing keys
        shell: bash
        env:
          APT_KEY_PASSWORD: ${{ secrets.APT_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077

          if [[ -z "${APT_KEY_PASSWORD:-}" ]]; then
            echo "APT_KEY_PASSWORD is not configured in the apt-signing environment" >&2
            exit 1
          fi

          export GNUPGHOME
          GNUPGHOME="$(mktemp -d)"
          verify_home="$(mktemp -d)"
          output_dir="$RUNNER_TEMP/apt-signing-key-backup"
          mkdir -p "$output_dir"
          trap 'rm -rf "$GNUPGHOME" "$verify_home"' EXIT

          identity="Open Research Tools APT Archive <apt@openresearchtools.com>"
          gpg --batch --pinentry-mode loopback --passphrase '' \
            --quick-generate-key "$identity" rsa4096 cert 5y

          fingerprint="$(gpg --batch --with-colons --list-secret-keys "$identity" \
            | awk -F: '$1 == "fpr" { print $10; exit }')"
          test -n "$fingerprint"

          gpg --batch --pinentry-mode loopback --passphrase '' \
            --quick-add-key "$fingerprint" rsa4096 sign 3y

          printf '%s\n' "$fingerprint" > "$output_dir/fingerprint.txt"
          gpg --batch --export "$fingerprint" \
            > "$output_dir/openresearchtools-archive-keyring.gpg"
          gpg --batch --armor --export "$fingerprint" \
            > "$output_dir/openresearchtools-archive-keyring.asc"

          gpg --batch --export-secret-keys "$fingerprint" \
            | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 \
                --symmetric --cipher-algo AES256 --s2k-mode 3 \
                --s2k-digest-algo SHA512 --compress-algo none \
                --output "$output_dir/openresearchtools-apt-primary-backup.gpg" \
                3<<<"$APT_KEY_PASSWORD"

          gpg --batch --export-secret-subkeys "$fingerprint" \
            | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 \
                --symmetric --cipher-algo AES256 --s2k-mode 3 \
                --s2k-digest-algo SHA512 --compress-algo none \
                --output "$output_dir/openresearchtools-apt-ci-signing-subkey.gpg" \
                3<<<"$APT_KEY_PASSWORD"

          GNUPGHOME="$verify_home" gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 3 --decrypt \
            "$output_dir/openresearchtools-apt-ci-signing-subkey.gpg" \
            3<<<"$APT_KEY_PASSWORD" \
            | GNUPGHOME="$verify_home" gpg --batch --import

          printf 'APT signing-key bootstrap check\n' > "$RUNNER_TEMP/signing-check.txt"
          GNUPGHOME="$verify_home" gpg --batch --yes --detach-sign \
            "$RUNNER_TEMP/signing-check.txt"

      - name: Upload encrypted backup and public key
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apt-signing-key-backup
          path: ${{ runner.temp }}/apt-signing-key-backup/
          if-no-files-found: error
          retention-days: 7

